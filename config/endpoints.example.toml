# Non-secret endpoint template. Put the real provider configuration in a
# private deployment configuration or secret manager, never in Git.

[provider]
id = "openai-compatible"
base_url = "https://provider.example.invalid/v1"
api_key_env = "MODEL_API_KEY"
model = "replace-with-an-approved-model"

[limits]
max_prompt_characters = 12000
heartbeat_seconds = 15
absolute_timeout_seconds = 3600
