version = 1
authority = "local-exact-tree"

[[stages]]
name = "release-prerequisites"
kind = "preflight"
command = ["node", "scripts/release-prerequisites.mjs"]
failure_class = "environment_blocked"
timeout_seconds = 15

[[stages]]
name = "release-validation"
kind = "preflight"
command = ["node", "scripts/validate-release.mjs"]
failure_class = "product_test_failed"
timeout_seconds = 60

[[stages]]
name = "acpx-bootstrap"
kind = "bootstrap"
command = ["npm", "--prefix", "tools/acpx-vendor", "ci", "--ignore-scripts", "--no-audit", "--no-fund"]
failure_class = "environment_blocked"
timeout_seconds = 180

[[stages]]
name = "co-engineer-unit"
kind = "unit_tests"
command = ["npm", "--prefix", "plugins/codex-co-engineer", "test"]
failure_class = "product_test_failed"
timeout_seconds = 300
quiet_seconds = 30

[[stages]]
name = "comparison-fixtures"
kind = "unit_tests"
command = ["node", "--no-warnings", "--test", "scripts/compare-coengineer-runs.test.mjs"]
failure_class = "product_test_failed"
timeout_seconds = 30

[[stages]]
name = "cursor-compatibility-unit"
kind = "unit_tests"
command = ["npm", "--prefix", "plugins/cursor-cloud-control", "test"]
failure_class = "product_test_failed"
timeout_seconds = 180
quiet_seconds = 30

[[stages]]
name = "acpx-fake-provenance-unit"
kind = "unit_tests"
command = ["npm", "--prefix", "tools/acpx-vendor", "run", "test:publish-provenance"]
failure_class = "product_test_failed"
timeout_seconds = 120

[[stages]]
name = "mcp-inspector"
kind = "integration_tests"
command = ["node", "scripts/inspector-preflight.mjs"]
failure_class = "product_test_failed"
timeout_seconds = 120
env = { MCP_INSPECTOR_COMMAND = "mcp-inspector" }

[[stages]]
name = "local-process-boundary"
kind = "integration_tests"
command = ["node", "scripts/process-boundary-preflight.mjs"]
failure_class = "environment_blocked"
timeout_seconds = 30

[[stages]]
name = "codex-mcp-environment"
kind = "integration_tests"
command = ["node", "scripts/mcp-environment-preflight.mjs"]
failure_class = "environment_blocked"
timeout_seconds = 30

[[stages]]
name = "acpx-reproducible-build"
kind = "build"
command = ["npm", "--prefix", "tools/acpx-vendor", "run", "test:reproducible"]
failure_class = "product_test_failed"
timeout_seconds = 180

[[stages]]
name = "acpx-publish-provenance"
kind = "security_checks"
command = ["npm", "--prefix", "tools/acpx-vendor", "run", "verify:publish-provenance"]
failure_class = "product_test_failed"
timeout_seconds = 180

[[stages]]
name = "co-engineer-package-inventory"
kind = "artifact_verification"
command = ["npm", "pack", "./plugins/codex-co-engineer", "--dry-run", "--ignore-scripts", "--offline", "--json"]
failure_class = "product_test_failed"
timeout_seconds = 60

[[stages]]
name = "cursor-compatibility-package-inventory"
kind = "artifact_verification"
command = ["npm", "pack", "./plugins/cursor-cloud-control", "--dry-run", "--ignore-scripts", "--offline", "--json"]
failure_class = "product_test_failed"
timeout_seconds = 60
