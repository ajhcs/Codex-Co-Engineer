name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACPX_NPM_CACHE: /tmp/codex-acpx-release-npm-cache
      NPM_CONFIG_CACHE: /tmp/codex-acpx-release-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: umask 077 && npm install --global @modelcontextprotocol/inspector@2.2.0
      - run: umask 077 && node scripts/release-prerequisites.mjs
      - run: umask 077 && node scripts/validate-release.mjs
      - run: umask 077 && npm --prefix tools/acpx-vendor ci --ignore-scripts --no-audit --no-fund
      - run: umask 077 && npm --prefix plugins/codex-co-engineer test
      - run: umask 077 && node --no-warnings --test scripts/compare-coengineer-runs.test.mjs
      - run: umask 077 && node --no-warnings --test scripts/collect-coengineer-trial-usage.test.mjs
      - run: umask 077 && node --no-warnings --test scripts/prepare-coengineer-qualification.test.mjs
      - run: umask 077 && npm --prefix plugins/cursor-cloud-control test
      - run: umask 077 && npm --prefix tools/acpx-vendor run test:publish-provenance
      - run: umask 077 && node scripts/inspector-preflight.mjs
      - run: umask 077 && npm --prefix tools/acpx-vendor run test:reproducible
      - run: umask 077 && npm --prefix tools/acpx-vendor run verify:publish-provenance
      - run: umask 077 && npm pack ./plugins/codex-co-engineer --dry-run --ignore-scripts --offline --json
      - run: umask 077 && npm pack ./plugins/cursor-cloud-control --dry-run --ignore-scripts --offline --json
