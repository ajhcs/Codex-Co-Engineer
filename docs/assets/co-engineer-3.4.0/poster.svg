<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1088" role="img" aria-label="Give Codex a team of external co-engineers without giving up control.">
  <title>Co-Engineer</title>
  <desc>Readable static poster for GitHub and README relative-asset contracts. Bounded derivation of the visible interlocking-link mark. Not a pixel-faithful copy of absent raster logos. Muted visual demo. No autoplay audio.</desc>
  <rect width="1920" height="1088" fill="#ffffff"/>
  <rect x="48" y="48" width="1824" height="992" rx="36" fill="#ffffff" stroke="#E5E7EB" stroke-width="4"/>

  <svg x="220" y="88" width="1480" height="278" viewBox="0 0 1280 240">
    <defs>
      <mask id="poster-link-cut">
        <rect width="1280" height="240" fill="#ffffff"/>
        <g transform="translate(40,20) rotate(38 150 100)">
          <rect x="118" y="78" width="44" height="44" fill="#000000"/>
        </g>
      </mask>
    </defs>
    <g fill="none" stroke="#111111" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(40,20) rotate(-38 90 100)" mask="url(#poster-link-cut)">
        <rect x="20" y="55" width="140" height="90" rx="45" ry="45"/>
      </g>
      <g transform="translate(40,20) rotate(38 150 100)">
        <rect x="80" y="55" width="140" height="90" rx="45" ry="45"/>
      </g>
    </g>
    <text x="300" y="154" fill="#111111" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="2">Co-Engineer</text>
  </svg>

  <text x="960" y="460" text-anchor="middle" fill="#111111" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Give Codex a team of external co-engineers without giving up control.</text>
  <text x="960" y="528" text-anchor="middle" fill="#374151" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="28">up to eight isolated external co-engineers, one bounded run, one coordinated wait, one verified decision</text>
  <text x="960" y="588" text-anchor="middle" fill="#4B5563" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="24">Codex remains chief engineer, reviewer, and merge authority.</text>

  <g font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#111111">
    <rect x="70" y="680" width="340" height="64" rx="32" fill="#F3F4F6"/>
    <text x="240" y="720" text-anchor="middle">Delegating to Co-Engineer</text>
    <rect x="430" y="680" width="340" height="64" rx="32" fill="#F3F4F6"/>
    <text x="600" y="720" text-anchor="middle">Chatting with Co-Engineer</text>
    <rect x="790" y="680" width="320" height="64" rx="32" fill="#F3F4F6"/>
    <text x="950" y="720" text-anchor="middle">Using Grok Co-Engineer</text>
    <rect x="1130" y="680" width="340" height="64" rx="32" fill="#F3F4F6"/>
    <text x="1300" y="720" text-anchor="middle">Using Cursor Co-Engineer</text>
    <rect x="1490" y="680" width="350" height="64" rx="32" fill="#F3F4F6"/>
    <text x="1665" y="720" text-anchor="middle">Using Muse Co-Engineer</text>
  </g>

  <text x="960" y="860" text-anchor="middle" fill="#4B5563" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="22">Delegating starts one bounded run. Chatting inspects, continues, answers grouped attention, or cancels.</text>
  <text x="960" y="980" text-anchor="middle" fill="#6B7280" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="20">Codex-Co-Engineer. Muted visual demo. No autoplay audio.</text>
</svg>
